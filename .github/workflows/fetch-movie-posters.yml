name: Replace temporary movie poster assets

on:
  push:
    branches:
      - "2"
    paths:
      - ".github/workflows/fetch-movie-posters.yml"

permissions:
  contents: write

jobs:
  download-posters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch 2
        uses: actions/checkout@v4
        with:
          ref: "2"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download film poster images
        run: |
          set -eu
          mkdir -p assets/images
          curl --fail --location --retry 3 \
            "https://upload.wikimedia.org/wikipedia/en/3/3b/Black_Panther_Wakanda_Forever_poster.jpg" \
            --output assets/images/black_panther.jpg
          curl --fail --location --retry 3 \
            "https://upload.wikimedia.org/wikipedia/en/f/f7/The_Batman_%28film%29_poster.jpg" \
            --output assets/images/the_batman.jpg
          file assets/images/black_panther.jpg assets/images/the_batman.jpg
          test "$(file --mime-type -b assets/images/black_panther.jpg)" = "image/jpeg"
          test "$(file --mime-type -b assets/images/the_batman.jpg)" = "image/jpeg"

      - name: Commit poster images and remove temporary workflow
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f assets/images/black_panther.png assets/images/the_batman.png
          git rm -f .github/workflows/fetch-movie-posters.yml
          git add assets/images/black_panther.jpg assets/images/the_batman.jpg
          git commit -m "Replace placeholder images with movie posters"
          git push origin HEAD:2
